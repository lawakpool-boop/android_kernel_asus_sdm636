name: Compile Kernel TOM EAS 4.4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: eas

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libncurses5-dev \
        git-core tar wget clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev \
        python3 rsync lz4 liblz4-tool lzip

    - name: Get Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang

    - name: Build Kernel
      run: |
        # 1. Atur Environment
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="Hantu"
        export KBUILD_BUILD_HOST="Hantu-Lab"
        
        # 2. Modifikasi Defconfig
        # Pastikan file ada sebelum sed menjalankan perintah
        sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Hantu-EAS"/g' arch/arm64/configs/X00TD_defconfig

        # 3. Proses Build (Urutan yang Benar)
        # Hapus folder out lama agar benar-benar clean tanpa merusak Makefile
        rm -rf out
        mkdir -p out
        
        make O=out X00TD_defconfig
        
        # Jalankan kompilasi
        make -j$(nproc --all) O=out \
                      CC=clang \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-X00TD-Hantu
        # Menggunakan wildcard agar jika nama file sedikit berbeda tetap terupload
        path: out/arch/arm64/boot/Image.gz*
